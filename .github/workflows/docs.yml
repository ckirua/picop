name: docs

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "src/picop/**"
      - "docs/PIPELINE.md"
      - "scripts/check_pyi_docstrings.py"
      - "pyproject.toml"
      - "setup.py"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install UUID native dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libssl-dev

      - name: Install build + docs deps
        run: |
          pip install setuptools wheel Cython picobuild
          pip install -e ".[docs]" --no-build-isolation

      - name: Check public .pyi docstrings
        run: python scripts/check_pyi_docstrings.py

      - name: Build Sphinx HTML
        run: sphinx-build -b html doc/ doc/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
