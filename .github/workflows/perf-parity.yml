# Weekly Tier A re-measurement of every public helper against its plain-Python
# builtin. Four interpreters (3.14, 3.15, and their free-threaded builds) run the
# bench suite; the compare job proves docs/PERF_PARITY.md still lists the same
# always-slower helpers on every interpreter.
name: picop perf parity

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bound the CI pass; local regeneration keeps the heavier defaults.
  CPY_BENCH_N: "20000"
  CPY_BENCH_RUNS: "3"
  CPY_NATIVE: "0"

jobs:
  bench:
    name: Tier A benches (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install build dependencies
        run: python -m pip install setuptools wheel "Cython>=3.3.0" picobuild pyperf
      - name: Install picop
        run: python -m pip install -e . --no-build-isolation
      - name: Collect Tier A parity data
        run: python scripts/perf_parity_report.py --json > parity-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.python-version }}
          path: parity-${{ matrix.python-version }}.json
          if-no-files-found: error

  compare:
    name: Parity drift check
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*
          path: parity/
          merge-multiple: true
      - name: Install build dependencies
        run: python -m pip install setuptools wheel "Cython>=3.3.0" picobuild pyperf
      - name: Install picop
        run: python -m pip install -e . --no-build-isolation
      - name: Compare helper sets against docs/PERF_PARITY.md
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from perf_parity_report import classify, public_names

          versions = ("3.14", "3.15", "3.14t", "3.15t")
          sets = {}
          for version in versions:
              data = json.loads(Path(f"parity/parity-{version}.json").read_text(encoding="utf-8"))
              always, _ = classify(data["ratios"], public_names(), 1.02)
              sets[version] = {name for name, _ in always}
              print(f"{version}: {len(sets[version])} always-slower helpers")

          reference = sets["3.15"]
          for version, names in sets.items():
              if names != reference:
                  gained = sorted(names - reference)
                  lost = sorted(reference - names)
                  print(f"{version} disagrees with 3.15: gained {gained}, lost {lost}")
                  raise SystemExit(1)

          doc = Path("docs/PERF_PARITY.md").read_text(encoding="utf-8")
          section = doc.split("## Always slower from pure Python", 1)[1].split("\n## ", 1)[0]
          documented = {
              row.split("|")[1].strip().strip("`")
              for row in section.splitlines()
              if row.startswith("| `")
          }
          missing = sorted(reference - documented)
          stale = sorted(documented - reference)
          if missing or stale:
              print(f"docs/PERF_PARITY.md is stale: newly slower {missing}, no longer slower {stale}")
              print("regenerate with: python scripts/perf_parity_report.py --update-doc --sync-stubs")
              raise SystemExit(1)
          print(f"docs/PERF_PARITY.md matches all four interpreters ({len(reference)} helpers)")
          PY
