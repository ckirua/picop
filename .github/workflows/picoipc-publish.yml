name: picoipc publish

on:
  push:
    tags: ["picoipc-v*"]

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build one Python 3.15 sdist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/picoipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Build and inspect immutable sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name 'picoipc-*.tar.gz' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: picoipc-sdist
          path: packages/picoipc/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  validate-sdist:
    needs: build-sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15", "3.14t", "3.15t"]
    defaults:
      run:
        working-directory: packages/picoipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: picoipc-sdist
          path: packages/picoipc/artifact
      - name: Install native toolchain and exact sdist
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libatomic1
          python -m venv .venv-validation
          PY="$PWD/.venv-validation/bin/python"
          "$PY" -m pip install --upgrade pytest 'pybind11>=3.1.0'
          "$PY" -m pip install artifact/*.tar.gz
          SITE="$($PY -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          BUILD="$PWD/build/${{ matrix.python-version }}"
          cmake -S native -B "$BUILD" -DCMAKE_BUILD_TYPE=Release \
            -DSMH_Q_BUILD_PYTHON=ON -DPython_EXECUTABLE="$PY" \
            -Dpybind11_DIR="$($PY -m pybind11 --cmakedir)"
          cmake --build "$BUILD" -j"$(nproc)"
          echo "SMH_Q_CPP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "SMH_Q_LIB=$SITE/picoipc/libsmh_q.so" >> "$GITHUB_ENV"
          echo "PYTHON_VALIDATION=$PY" >> "$GITHUB_ENV"
      - name: Run CTest and exact installed artifact backends
        run: |
          ctest --test-dir "$SMH_Q_CPP_BUILD" --output-on-failure
          cd "$RUNNER_TEMP"
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            env -u PYTHON_GIL PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 "$PYTHON_VALIDATION" - <<'PY'
          import pkgutil, sys
          assert not sys._is_gil_enabled()
          import picoipc
          assert not sys._is_gil_enabled()
          import picoipc._native
          for info in pkgutil.walk_packages(picoipc.__path__, picoipc.__name__ + '.'):
              __import__(info.name)
          assert picoipc.impl_name() == 'pybind11'
          assert not sys._is_gil_enabled()
          PY
          fi
          PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 SMH_Q_LIB="$SMH_Q_LIB" \
            "$PYTHON_VALIDATION" -m pytest "$GITHUB_WORKSPACE/packages/picoipc/tests" -q
          PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python \
            "$PYTHON_VALIDATION" -m pytest "$GITHUB_WORKSPACE/packages/picoipc/tests/test_ring.py" -q
          PICOIPC_BACKEND=ctypes PICOIPC_EXPECTED_IMPL=ctypes SMH_Q_LIB="$SMH_Q_LIB" \
            "$PYTHON_VALIDATION" -m pytest "$GITHUB_WORKSPACE/packages/picoipc/tests/test_ring.py" -q
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            env -u PYTHON_GIL PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 SMH_Q_LIB="$SMH_Q_LIB" \
              "$PYTHON_VALIDATION" -X gil=0 -m pytest "$GITHUB_WORKSPACE/packages/picoipc/tests/test_ring.py" -q
            env -u PYTHON_GIL PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python \
              "$PYTHON_VALIDATION" -X gil=0 -m pytest "$GITHUB_WORKSPACE/packages/picoipc/tests/test_ring.py" -q
            env -u PYTHON_GIL PICOIPC_BACKEND=ctypes PICOIPC_EXPECTED_IMPL=ctypes SMH_Q_LIB="$SMH_Q_LIB" \
              "$PYTHON_VALIDATION" -X gil=0 -m pytest "$GITHUB_WORKSPACE/packages/picoipc/tests/test_ring.py" -q
          fi
          PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 "$PYTHON_VALIDATION" - <<'PY'
          import picoipc, sysconfig
          assert picoipc.__file__.startswith(sysconfig.get_paths()['purelib'])
          assert picoipc.impl_name() == 'pybind11'
          print('actual installed backend:', picoipc.impl_name())
          PY
          PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 SMH_Q_LIB="$SMH_Q_LIB" \
            "$PYTHON_VALIDATION" -c "import picoipc; assert picoipc.impl_name() == 'pybind11'"
          PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python \
            "$PYTHON_VALIDATION" -c "import picoipc; assert picoipc.impl_name() == 'pure_python'"
          PICOIPC_BACKEND=ctypes PICOIPC_EXPECTED_IMPL=ctypes SMH_Q_LIB="$SMH_Q_LIB" \
            "$PYTHON_VALIDATION" -c "import picoipc; assert picoipc.impl_name() == 'ctypes'"

  production-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/picoipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libatomic1
          python -m pip install --upgrade pytest
      - name: Run production gate against committed baseline
        env:
          PYTHON: python
          PICOIPC_BACKEND: pybind11
        run: ./bench/run_gate.sh

  publish:
    needs: [validate-sdist, production-gate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: picoipc-sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
