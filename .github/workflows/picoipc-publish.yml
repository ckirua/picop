name: picoipc publish

on:
  push:
    tags: ["picoipc-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/picoipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake python3-dev
      - name: Build and validate sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          twine check dist/*
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install dist/*.tar.gz
          "$smoke_dir/venv/bin/python" -c "from picoipc import Ring; assert Ring is not None"
          rm -rf "$smoke_dir"
      - name: Run native correctness and performance gate
        run: |
          python -m pip install --upgrade pytest
          ./bench/run_gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: picoipc-dist
          path: packages/picoipc/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: picoipc-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
