name: picoipc smoke

on:
  pull_request:
    branches: [main, python-3.15]
    paths: ["packages/picoipc/**", ".github/workflows/picoipc-smoke.yml"]
  push:
    branches: [main, python-3.15]
    paths: ["packages/picoipc/**", ".github/workflows/picoipc-smoke.yml"]

permissions:
  contents: read

jobs:
  native-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15", "3.14t", "3.15t"]
    defaults:
      run:
        working-directory: packages/picoipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libatomic1
      - name: Build CTest and matching Python extension
        run: |
          python -m pip install --upgrade pytest 'pybind11>=3.1.0'
          build="build/${{ matrix.python-version }}"
          pybind_dir="$(python -m pybind11 --cmakedir)"
          cmake -S native -B "$build" -DCMAKE_BUILD_TYPE=Release \
            -DSMH_Q_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(command -v python)" -Dpybind11_DIR="$pybind_dir"
          cmake --build "$build" -j"$(nproc)"
          mkdir -p "$build/stage/picoipc"
          cp src/picoipc/*.py "$build/stage/picoipc/"
          cmake --install "$build" --prefix "$build/stage"
          echo "SMH_Q_CPP_BUILD=$PWD/$build" >> "$GITHUB_ENV"
          echo "SMH_Q_PYTHON_DIR=$PWD/$build/stage" >> "$GITHUB_ENV"
          echo "SMH_Q_LIB=$PWD/$build/stage/picoipc/libsmh_q.so" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/$build/stage" >> "$GITHUB_ENV"
      - name: Run native CTest
        run: ctest --test-dir "$SMH_Q_CPP_BUILD" --output-on-failure
      - name: Validate each actual backend
        run: |
          PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python -c "from picoipc import impl_name; assert impl_name() == 'pybind11'"
          PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python -m pytest tests -q
          PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python python -c "from picoipc import impl_name; assert impl_name() == 'pure_python'"
          PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python python -m pytest tests/test_ring.py -q
          PICOIPC_BACKEND=ctypes PICOIPC_EXPECTED_IMPL=ctypes python -c "from picoipc import impl_name; assert impl_name() == 'ctypes'"
          PICOIPC_BACKEND=ctypes PICOIPC_EXPECTED_IMPL=ctypes python -m pytest tests/test_ring.py -q
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            env -u PYTHON_GIL PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python - <<'PY'
          import pkgutil, sys
          assert not sys._is_gil_enabled()
          import picoipc
          assert not sys._is_gil_enabled()
          import picoipc._native
          for info in pkgutil.walk_packages(picoipc.__path__, picoipc.__name__ + '.'):
              __import__(info.name)
          assert not sys._is_gil_enabled()
          assert picoipc.impl_name() == 'pybind11'
          PY
            env -u PYTHON_GIL PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python -m pytest tests -q
            env -u PYTHON_GIL PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python -X gil=0 -m pytest tests/test_ring.py -q
            env -u PYTHON_GIL PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python python -X gil=0 -m pytest tests/test_ring.py -q
            env -u PYTHON_GIL PICOIPC_BACKEND=ctypes PICOIPC_EXPECTED_IMPL=ctypes python -X gil=0 -m pytest tests/test_ring.py -q
          fi
      - name: Preserve production-only performance gate on Python 3.14
        if: matrix.python-version == '3.14'
        env:
          PYTHON: python
          SMH_Q_CPP_BUILD: ${{ env.SMH_Q_CPP_BUILD }}
          SMH_Q_PYTHON_DIR: ${{ env.SMH_Q_PYTHON_DIR }}
        run: ./bench/run_gate.sh
