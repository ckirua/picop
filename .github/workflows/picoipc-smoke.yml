name: picoipc smoke

on:
  pull_request:
    paths:
      - "packages/picoipc/**"
      - ".github/workflows/picoipc-smoke.yml"
  push:
    branches: [main]
    paths:
      - "packages/picoipc/**"
      - ".github/workflows/picoipc-smoke.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/picoipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Gate
        run: |
          # Required production build, CTest, pybind11 correctness, and pybind11 baseline comparison.
          ./bench/run_gate.sh

          # Prove the staged default extension is actually selected, then run the full Python suite.
          PYTHONPATH=src PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python -c "from picoipc import impl_name; assert impl_name() == 'pybind11'"
          PYTHONPATH=src PICOIPC_BACKEND=pybind11 PICOIPC_EXPECTED_IMPL=pybind11 python -m pytest tests -q

          # Require the portable reference implementation to satisfy the same Ring contract.
          PYTHONPATH=src PICOIPC_BACKEND=pure PICOIPC_EXPECTED_IMPL=pure_python python -m pytest tests/test_ring.py -q

          # Pure runs configured correctness and emits a distinct result, but has no invalid pybind11 performance comparison.
          PYTHONPATH=src PICOIPC_BACKEND=pure python bench/harness.py --config bench/config_smoke.yaml --output artifacts/bench_pure.json
