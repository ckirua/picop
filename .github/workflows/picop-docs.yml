name: picop docs

on:
  push:
    branches: [main]
    paths:
      - "packages/picop/doc/**"
      - "packages/picop/src/picop/**"
      - "packages/picop/docs/PIPELINE.md"
      - "packages/picop/scripts/check_pyi_docstrings.py"
      - "packages/picop/pyproject.toml"
      - "packages/picop/setup.py"
      - "packages/picop/CHANGELOG.md"
      - ".github/workflows/picop-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/picop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install UUID native dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libssl-dev

      - name: Install build + docs deps
        run: |
          pip install setuptools wheel Cython picobuild
          pip install -e ".[docs]" --no-build-isolation

      - name: Check public .pyi docstrings
        run: python scripts/check_pyi_docstrings.py

      - name: Build Sphinx HTML
        run: sphinx-build -b html doc/ doc/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/picop/doc/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
