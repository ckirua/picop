name: picop smoke

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  consumer-map:
    name: Consumer catalog coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate complete consumer catalog
        run: |
          python scripts/check_consumer_map.py
          python -m pytest tests/test_consumer_map.py -q
  shims:
    name: Shim headers (strict C11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential
      - name: Compile every shim header with -std=c11 -pedantic-errors -Werror
        run: python scripts/check_shims_pedantic.py

  header-delta:
    name: Header delta vs the 3.14 baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Every new public symbol is linked, ledgered, or rejected
        run: python scripts/header_delta.py --baseline scripts/header_baseline_314.json --fail-on-unaccounted

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential
      - name: Build and check sdist
        env:
          CPY_NATIVE: "0"
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: picop-smoke-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  installed:
    needs: build-sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: picop-smoke-sdist
          path: artifact
      - name: Install native dependencies and exact sdist
        env:
          CPY_NATIVE: "0"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential
          python -m pip install --upgrade pytest setuptools
          python -m pip install artifact/*.tar.gz
      - name: Installed artifact behavior outside checkout
        env:
          CPY_NATIVE: "0"
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp -R tests scripts examples docs "$tmp/"
          cd "$tmp"
          python - <<'PY'
          import sys, sysconfig
          print('version', sys.version, 'Py_GIL_DISABLED', sysconfig.get_config_var('Py_GIL_DISABLED'))
          PY
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            env -u PYTHON_GIL python -c 'import pathlib, sys; assert not sys._is_gil_enabled(); import picop; assert not sys._is_gil_enabled(); assert not pathlib.Path(picop.__file__).is_relative_to(pathlib.Path.cwd())'
            env -u PYTHON_GIL python - <<'PY'
          import pkgutil, sys
          assert not sys._is_gil_enabled()
          import picop
          for info in pkgutil.walk_packages(picop.__path__, picop.__name__ + '.'):
              __import__(info.name)
          assert not sys._is_gil_enabled(), 'GIL enabled after native module imports'
          PY
          else
            python -c 'import pathlib, picop; assert not pathlib.Path(picop.__file__).is_relative_to(pathlib.Path.cwd())'
          fi
          python -m pytest tests -q
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            python -X gil=0 -m pytest tests -q
          fi
          python "$GITHUB_WORKSPACE/scripts/check_exports.py"
          python "$GITHUB_WORKSPACE/scripts/ops_inventory_coverage.py" --strict
          for f in examples/py*.py examples/wrap_ansi.py; do python "$f"; done
          PYTHON="$(command -v python)" bash scripts/smoke_barrel_cimport.sh
