name: picop UUID free-threaded compatibility

on:
  push:
    branches: [main, python-3.15]
    paths: ["packages/picop/**", ".github/workflows/picop-uuid-freethreaded.yml"]
  pull_request:
    branches: [main, python-3.15]
    paths: ["packages/picop/**", ".github/workflows/picop-uuid-freethreaded.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uuid-freethreaded:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    name: CPython ${{ matrix.python-version }} genuine no-GIL UUID
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/picop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install native build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libssl-dev
      - name: Create isolated build environment
        run: |
          python -m venv .venv-uuid-freethreaded
          .venv-uuid-freethreaded/bin/python -m pip install --disable-pip-version-check setuptools 'Cython>=3.3.0'
      - name: Build only the UUID extensions
        env:
          CPY_NATIVE: "0"
        run: .venv-uuid-freethreaded/bin/python scripts/ci/build_uuid_freethreaded.py
      - name: Verify genuine no-GIL UUID APIs
        env:
          PYTHONPATH: src
        run: |
          .venv-uuid-freethreaded/bin/python - <<'PY'
          import sys
          import types
          import uuid
          from pathlib import Path

          assert not sys._is_gil_enabled(), 'interpreter did not start with GIL disabled'
          package = types.ModuleType('picop')
          package.__path__ = [str(Path('src/picop').resolve())]
          sys.modules['picop'] = package

          from picop.uuid import UUID, uuid4, uuid4_bytes
          assert not sys._is_gil_enabled(), 'UUID extension enabled the GIL'
          assert uuid.UUID in UUID.__mro__
          value = uuid4()
          raw = uuid4_bytes()
          assert isinstance(value, UUID) and isinstance(value, uuid.UUID)
          assert value.version == 4 and value.variant == uuid.RFC_4122
          assert len(raw) == 16 and raw[6] >> 4 == 4 and raw[8] & 0xC0 == 0x80
          reconstructed = UUID(raw)
          assert reconstructed.version == 4 and reconstructed.variant == uuid.RFC_4122
          assert not sys._is_gil_enabled(), 'GIL was enabled during UUID use'
          PY
