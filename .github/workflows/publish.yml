# Publish picop to PyPI (Trusted Publishing / OIDC).
# Pushing picop-v* runs .github/workflows/publish.yml.
# One-time setup (before the first tag publish):
#   1. Create a PyPI account and claim the pending publisher for project "picop":
#        https://pypi.org/manage/account/publishing/
#      Owner: ckirua  ·  Repo: picop  ·  Workflow: publish.yml  ·  Environment: pypi
#   2. (Optional) Same for TestPyPI with environment: testpypi
#   3. Create matching GitHub Environments "pypi" / "testpypi" (optional protection rules).
#
# Trigger: annotated picop version tags (picop-vX.Y.Z) after the version bump is on main.
# Manual: workflow_dispatch → choose testpypi or pypi.
#
# Artifacts: sdist only. PyPI rejects plain linux_x86_64 wheels; manylinux
# wheels need cibuildwheel (follow-up). Users build from sdist (C toolchain +
# OpenSSL headers).

name: picop publish

on:
  push:
    tags: ["picop-v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/picop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libssl-dev

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist
        env:
          CPY_NATIVE: "0"
        run: python -m build --sdist

      - name: Check metadata
        run: twine check dist/*

      - name: Smoke built sdist
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          python -m venv "$smoke_dir/venv"
          CPY_NATIVE=0 "$smoke_dir/venv/bin/python" -m pip install "$(pwd)"/dist/picop-*.tar.gz
          "$smoke_dir/venv/bin/python" -c "from picop.hot import bytes_len, dict_get, str_len; assert bytes_len(b'ok') == 2; assert dict_get({'a': 1}, 'a') == 1; assert str_len('ok') == 2"
          "$smoke_dir/venv/bin/python" -W default -c "import cypy; from cypy.hot import bytes_len; assert bytes_len(b'ok') == 2; assert cypy.__version__ == __import__('picop').__version__"
          PYTHON="$smoke_dir/venv/bin/python" bash scripts/smoke_barrel_cimport.sh


      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: packages/picop/dist/

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
