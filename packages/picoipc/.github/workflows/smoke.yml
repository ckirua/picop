name: smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev
      - name: Gate
        run: |
          chmod +x bench/run_gate.sh
          SMH_Q_BACKEND=pure RECORD_BASELINE=1 ./bench/run_gate.sh || true
          ./bench/run_gate.sh
