[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "picoipc"
version = "0.1.0"
description = "Low-latency local IPC primitives for Linux"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.scikit-build]
cmake.source-dir = "native"
cmake.args = ["-DSMH_Q_BUILD_PYTHON=ON"]
wheel.packages = ["src/picoipc"]

[tool.scikit-build.cmake.define]
SMH_Q_BUILD_PYTHON = "ON"
