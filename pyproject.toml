[build-system]
requires = [
    "setuptools",
    "wheel",
    "Cython",
    "picobuild",
]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (preferred import package is ``picop``; ``cypy`` is a deprecated soft alias).
name = "picop"
description = "Fast CPython C-API helpers and C-backed UUID values for Cython"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "ckirua", email = "aquipongoalgo.dsz@gmail.com" }]
requires-python = ">=3.14"
dynamic = ["version"]
keywords = [
    "cython",
    "cpython",
    "c-api",
    "performance",
    "dict",
    "str",
    "bytes",
    "uuid",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "Cython",
    "picobuild",
]

[project.urls]
Homepage = "https://github.com/ckirua/cypy"
Repository = "https://github.com/ckirua/cypy"
Issues = "https://github.com/ckirua/cypy/issues"
Documentation = "https://ckirua.github.io/cypy/"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyperf>=2.10.0", "build", "twine"]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
    "linkify-it-py>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "picop.__about__.__version__" }
